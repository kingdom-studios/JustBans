# !-----------------------------------------------------------------------------------------------!
#                       Welcome to the main configuration of ${project.name}
# !-----------------------------------------------------------------------------------------------!
#
#    This is the main plugin's settings class. You can use SimpleSettings to load values from it,
#    and update it automatically.
#
#    For support and documentation, please visit:
#    - https://github.com/${author}/${project.name}/wiki
#
# !-----------------------------------------------------------------------------------------------!
#
#    1) COLOR CODES are supported with the '&' character.
#       - For usage, see http://minecraftwiki.net/wiki/Formatting_codes
#       - When you use them, place quotes around the message like this: "Hello &cworld."
#       - To use HEX colors, use #123456 syntax: "Hello #123456world."
#
#    2) TO HIDE any message, set it to 'none'.
#
#    3) For UNICODE CHARACTERS (smileys, symbols, ..), save the file in UTF-8 encoding. See
#       - https://github.com/${author}/${project.name}/wiki/Use-Right-Encoding
#
#    4) JSON is supported.
#       - For usage, see https://github.com/${author}/${project.name}/wiki/JSON
#
#    5) WHITELISTS can be turned into blacklists, by putting "@blacklist" on the first line.
#       - Doing such, filters will only apply for messages in those lists.
#
#    PS: Everything above applies for all files in ${project.name}/ folder.
#
# !-----------------------------------------------------------------------------------------------!

# -------------------------------------------------------------------------------------------------
# The formats used in the {date}, {date_short}, {date_month} and {location}. 
#
# See the link below to learn how to edit the date format:
# https://docs.oracle.com/javase/8/docs/api/java/text/SimpleDateFormat.html
# -------------------------------------------------------------------------------------------------
Date_Format: "dd.MM.yyyy HH:mm:ss"
Date_Format_Short: "dd.MM.yyyy HH:mm"
Date_Format_Month: "dd.MM HH:mm"
Location_Format: "{world} {x}, {y}, {z}"

# -------------------------------------------------------------------------------------------------
# What commands should trigger the main plugin command group?
#
# * THE FIRST ALIAS IS THE MAIN LABEL, YOU CAN CHANGE IT BUT DO NOT REMOVE IT. *
# * EXAMPLE: [boss, b] will trigger your main command from "/boss" or "/b" * 
# -------------------------------------------------------------------------------------------------
Command_Aliases: [justbans, jb]

# -------------------------------------------------------------------------------------------------
# What language should we use for messages? If it exists, the language file will be copied 
# to your messages/ folder where you can edit it.
# -------------------------------------------------------------------------------------------------
Locale: en

# -------------------------------------------------------------------------------------------------
# The prefix used in front of most chat or console messages. You can manually use it with
# {plugin_prefix} variable anywhere.
# -------------------------------------------------------------------------------------------------
Prefix: "&8[&c${project.name}&8]&7"

# -------------------------------------------------------------------------------------------------
# Time of some plugin's operations is measured. You can also use the LagCatcher class to invoke
# this feature. We log a console message if an operation takes over the time below (milliseconds). 
# Set to -1 to disable.
# -------------------------------------------------------------------------------------------------
Log_Lag_Over_Milis: 100

# -------------------------------------------------------------------------------------------------
# List of section names that will print informative messages about this plugin's features.
# The Debugger class utilizes this key and will only print messages for sections enabled below.
#
# JustBans sections:
#   database  - every database call: kind, duration, thread
#   redis     - every Redis message sent or received (type, node, seq, size, signature result), and locks
#   enforce   - login-gate decisions of this server
#   sweeper   - expiry sweeper rounds
# Use ["*"] for everything. Example:  Debug: [database, redis]
# -------------------------------------------------------------------------------------------------
Debug: []

# -------------------------------------------------------------------------------------------------
# This server. The name MUST match the server name in the proxy's velocity.toml, because server bans
# are stored by that name.
# -------------------------------------------------------------------------------------------------
Server:
  Name: "survival"

  # Optional group this server belongs to (must match server-groups in the proxy's config.yml).
  # Group bans on this group also apply here. Leave empty for none.
  Group: ""

# -------------------------------------------------------------------------------------------------
# The shared MariaDB database (the same one the proxy uses).
# -------------------------------------------------------------------------------------------------
Database:
  Host: "127.0.0.1"
  Port: 3306
  Name: "justbans"
  User: "justbans"
  Password: ""
  Pool_Size: 6
  Connection_Timeout_Millis: 10000

  # A pooled connection is replaced after Max_Lifetime_Millis, and idle ones are pinged every Keepalive_Millis. Both keep a database
  # server or firewall that closes quiet connections (MariaDB wait_timeout, idle limits) from leaving dead ones in the pool, which
  # shows up as "Failed to validate connection ... closed connection" warnings. Keep Max_Lifetime_Millis below the shortest such limit.
  # Keepalive_Millis: 0 turns the ping off, otherwise it must be 30000 or more and below Max_Lifetime_Millis.
  Max_Lifetime_Millis: 600000
  Keepalive_Millis: 60000

# -------------------------------------------------------------------------------------------------
# The shared Redis. Used to tell the proxy about new punishments instantly and to learn who is
# online on the whole network. Redis is only a notifier: if it is down, punishments still work.
# -------------------------------------------------------------------------------------------------
Redis:
  Host: "127.0.0.1"
  Port: 6379
  User: ""
  Password: ""
  Ssl: false
  Database: 0
  Prefix: "justbans:"
  Connect_Timeout_Millis: 5000

  # REQUIRED: at least 16 characters. Must be identical on the proxy and in the web panel.
  # Every Redis message is signed with it.
  Web_Secret: ""

# -------------------------------------------------------------------------------------------------
# Execute commands sent by the web panel on this server. Normally the proxy does this, so leave it
# off unless you run no proxy-side handler.
# -------------------------------------------------------------------------------------------------
Web_Commands:
  Enabled: false
  Max_Skew_Seconds: 30

# -------------------------------------------------------------------------------------------------
# Announces expired bans and warns to the whole network (PUNISHMENT_EXPIRED events: caches refresh,
# the web panel updates). Every node with this on takes part, but a Redis lock lets only ONE of them
# sweep per interval, so it is safe to leave on everywhere.
# -------------------------------------------------------------------------------------------------
Expiry_Sweeper:
  Enabled: true
  Interval_Seconds: 60

# -------------------------------------------------------------------------------------------------
# PlaceholderAPI (needs the PlaceholderAPI plugin):
#   %justbans_warns%             number of the player's active warns
#   %justbans_banned_servers%    servers/groups the player is banned from (comma separated)
#   %justbans_last_punishment%   the player's most recent punishment, formatted below
#   %justbans_active_ban_expiry% time left on the player's soonest-ending active ban
# Values come from a per-player cache that is loaded when the player joins and refreshed by events,
# so placeholders never wait for the database. Until the first load finishes they show Loading_Text.
# -------------------------------------------------------------------------------------------------
Placeholders:

  # Safety-net refresh of a player's cached data, in case an event was missed.
  Refresh_Seconds: 60

  # Shown by the text placeholders when there is nothing to show (%justbans_warns% simply shows 0).
  None_Text: "none"

  # Shown while a player's data is still loading right after joining.
  Loading_Text: ""

  # Shown by %justbans_active_ban_expiry% for a ban that never ends.
  Permanent_Text: "permanent"

  # {type} {reason} {id} {actor} {ago}
  Last_Punishment_Format: "{type}: {reason} ({ago} ago)"

# -------------------------------------------------------------------------------------------------
# Anonymous usage statistics through bStats (https://bstats.org). bStats' own global switch
# (its config file in the plugins folder) also applies.
# -------------------------------------------------------------------------------------------------
Statistics:
  Enabled: true

# -------------------------------------------------------------------------------------------------
# Punishment behaviour
# -------------------------------------------------------------------------------------------------
Punishments:

  # The proxy normally keeps banned players out. When on, this server also checks every login itself
  # as a safety net (for a failed proxy, or players connecting around it).
  Local_Gate: true

  # If the database cannot be reached during that check: Allow the player in, or Deny the login.
  Gate_On_Database_Error: "Allow"

  # Message shown by the local gate when the ban has no custom screen. MiniMessage.
  # Placeholders: <target> <actor> <reason> <id> <expires> <remaining> <server> <scope>
  Gate_Ban_Screen:
    - "<red><bold>You are banned</bold></red>"
    - ""
    - "<gray>Reason: <white><reason></white>"
    - "<gray>Expires: <white><expires></white> <dark_gray>(<remaining>)</dark_gray>"
    - ""
    - "<gray>Punishment ID: <yellow>#<id></yellow>"
  Gate_Database_Error_Screen:
    - "<red>We could not verify your account right now."
    - "<gray>Please try again in a moment."

  # When on, a player can only be punished by someone with a higher LuckPerms group weight
  # (needs LuckPerms). Players with weight 0 are never protected by this.
  Use_Weights: false

  Date_Format_Pattern: "dd.MM.yyyy HH:mm"
  Time_Zone: "UTC"

  # How often queued events are retried when Redis was unreachable.
  Outbox_Interval_Millis: 2000

# -------------------------------------------------------------------------------------------------
# Do not change this value, otherwise it will corrupt your plugin installation!
# NB: Don't forget to keep this up-to-date with the getConfigVersion method in your Settings class. 
# -------------------------------------------------------------------------------------------------
Version: 1