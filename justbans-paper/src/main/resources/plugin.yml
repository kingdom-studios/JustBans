#
# This is the file your server opens to find the main class of your 
# plugin and its information. We automatically replace variables here 
# from your pom.xml file. YOU GENERALLY DO NOT NEED TO EDIT THIS.
#
# See https://www.spigotmc.org/wiki/plugin-yml/ for more information.
# 
name: ${project.name} 
version: ${project.version}
main: ${main.class}
author: ${author}
api-version: "26.2"
# Plugins that we support so that we are loaded after them for your convenience.
softdepend: [AuthMe, BanManager, BungeeChatAPI, CMI, DiscordSRV, Factions, Feudal, ItemsAdder, Essentials, LegacyFactions, Lands, LuckPerms, Multiverse-Core, MVdWPlaceholderAPI, MythicMobs, mcMMO, Nicky, PlaceholderAPI, ProtocolLib, SimpleClans, Towny, TownyChat, Vault, WorldEdit]
# The commands are built at runtime so you can change them easily within the settings.
# Do not change anything in here, you will break the plugin and get no support.
commands:
permissions:
  justbans.ban:
    description: Permanently ban players
    default: op
  justbans.tempban:
    description: Temporarily ban players
    default: op
  justbans.warn:
    description: Warn players
    default: op
  justbans.unwarn:
    description: Remove a player's last warn
    default: op
  justbans.kick:
    description: Kick players from the network
    default: op
  justbans.unban:
    description: Pardon banned players
    default: op
  justbans.check:
    description: View a player's active punishments
    default: op
  justbans.gui:
    description: Open the punishment menu (/punish)
    default: op
  justbans.history:
    description: Browse punishment history (/history)
    default: op
  justbans.edit:
    description: Change the expiry, reason or note of a punishment (/justbans edit)
    default: op
  justbans.admin:
    description: Reload JustBans
    default: op
  justbans.reason.custom:
    description: Use free-text reasons instead of predefined reason ids
    default: op
  justbans.exempt:
    description: Cannot be punished
    default: false
